<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.s{width:390px;box-sizing:border-box;background:#FFFFFF;color:#111827;font-family:'Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.5;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bar{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #D1D5DB}
.bar h1{margin:0 0 0 8px;font-size:17px;font-weight:700;flex:1}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#111827;padding:0;text-decoration:none;font:inherit}
.tb{height:36px;border:1px solid #9CA3AF;border-radius:18px;background:#fff;padding:0 12px;font:inherit;font-size:13px;color:#111827;display:inline-flex;align-items:center;text-decoration:none}
.body{flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.h2{margin:0;font-size:15px;font-weight:700}
.lbl{font-size:12px;color:#4B5563}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid #E5E7EB;color:#111827;text-decoration:none}
.seg{display:flex;border:1px solid #9CA3AF;border-radius:8px;overflow:hidden;flex:none}
.seg a,.seg span{flex:1;text-align:center;padding:10px 0;font-size:13px;color:#111827;text-decoration:none}
.seg .on{background:#111827;color:#FFFFFF}
.tag{font-size:11px;border:1px solid #9CA3AF;border-radius:4px;padding:0 6px;color:#374151}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #E5E7EB;border-left:1px solid #E5E7EB}
.cal>div{height:52px;border-right:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;padding:2px 4px;box-sizing:border-box;font-size:12px}
.cal>.wk{height:24px;text-align:center;color:#4B5563;font-size:11px}
.tabs{height:64px;flex:none;border-top:1px solid #D1D5DB;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#4B5563;text-decoration:none}
.tabs a.on{color:#1D4ED8;font-weight:700}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:absolute;right:16px;bottom:80px;width:56px;height:56px;border-radius:28px;background:#1D4ED8;color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.mode{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid #111827;border-radius:10px;overflow:hidden}
.mode a,.mode span{text-align:center;padding:10px 0;font-size:14px;font-weight:700;color:#111827;text-decoration:none}
.mode .on{background:#111827;color:#FFFFFF}
.sumA{border:1px solid #111827;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sumP{border:1.5px dashed #1D4ED8;background:#F8FAFF;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.s3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.s3 .v{font-size:16px;font-weight:700}
.mc{display:grid;grid-template-columns:40px 1fr 1fr 1fr;gap:6px;align-items:center;min-height:40px;border-bottom:1px solid #E5E7EB;font-size:12.5px;color:#111827;text-decoration:none}
.mc .num{text-align:right}
.sumA .lbl{font-size:12px;color:#4B5563}

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1090}}'>
class Component extends DCLogic {
  renderVals() {
    const marked = [1, 3, 5, 8, 10, 11, 14, 17, 20, 22, 25, 27];
    const days = [];
    for (let i = 0; i < 35; i++) {
      const n = i + 1;
      const inMonth = n <= 30;
      days.push({
        d: inMonth ? String(n) : '',
        has: inMonth && marked.indexOf(n) >= 0,
        style: n === 11 ? 'background: #EFF6FF; outline: 2px solid #1D4ED8; outline-offset: -2px' : ''
      });
    }
    return { days };
  }
}
</script>
