<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>予実比較</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.s{width:390px;box-sizing:border-box;background:#FFFFFF;color:#111827;font-family:'Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.5;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bar{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #D1D5DB}
.bar h1{margin:0 0 0 4px;font-size:17px;font-weight:700;flex:1}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#111827;padding:0;text-decoration:none;font:inherit}
.body{flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;color:#4B5563}
.in{height:44px;border:1px solid #9CA3AF;border-radius:6px;padding:0 10px;font:inherit;box-sizing:border-box;width:100%;background:#fff;color:#111827}
.seg{display:flex;border:1px solid #9CA3AF;border-radius:8px;overflow:hidden;flex:none}
.seg a,.seg span,.seg button{flex:1;text-align:center;padding:10px 0;font:inherit;font-size:13px;color:#111827;text-decoration:none;border:0;background:#fff}
.seg .on{background:#111827;color:#FFFFFF}
.ba{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid #E5E7EB}
.track{height:10px;background:#F3F4F6;border-radius:3px;position:relative}
.plan{position:absolute;top:0;left:0;height:10px;border:1.5px dashed #1D4ED8;border-radius:3px;box-sizing:border-box}
.act{position:absolute;top:2px;left:0;height:6px;background:#111827;border-radius:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="s" style="height: 844px">
<header class="bar">
<a class="ib" href="Ledger.dc.html" aria-label="戻る"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1>予実比較</h1>
</header>
<main class="body">
<div class="lbl">計画＝ホームで表示中の「プランB（住宅購入）」。プランの切り替えはホームで行います。</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button class="ib" aria-label="前の月"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<strong style="font-size: 16px">2026年11月</strong>
<button class="ib" aria-label="次の月"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="seg"><button>収入</button><button class="on">支出</button></div>
<div style="display: flex; gap: 16px; font-size: 12px; color: #374151">
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 18px; height: 10px; border: 1.5px dashed #1D4ED8; box-sizing: border-box; display: inline-block"></span>計画（予算）</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 18px; height: 6px; background: #111827; display: inline-block"></span>実績</span>
</div>
<div style="display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; font-size: 12px; color: #4B5563; border-bottom: 1px solid #D1D5DB; padding-bottom: 4px">
<span>カテゴリ</span><span style="width: 64px; text-align: right">計画</span><span style="width: 64px; text-align: right">実績</span><span style="width: 64px; text-align: right">差額</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div class="ba">
<div style="display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; font-size: 13px">
<span>{{r.name}}</span><span class="num" style="width: 64px; text-align: right">¥00,000</span><span class="num" style="width: 64px; text-align: right">¥00,000</span><span class="num" style="width: 64px; text-align: right; font-weight: 700">{{r.diff}}</span>
</div>
<div class="track"><div class="plan" style="{{r.planW}}"></div><div class="act" style="{{r.actW}}"></div></div>
</div>
</sc-for>
<div style="display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; font-weight: 700; padding-top: 4px">
<span>合計</span><span class="num" style="width: 64px; text-align: right">¥000,000</span><span class="num" style="width: 64px; text-align: right">¥000,000</span><span class="num" style="width: 64px; text-align: right">+¥0,000</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const src = [
      ['食費', 70, 62, '+¥0,000'], ['住宅費', 90, 90, '¥0'], ['光熱費', 30, 36, '−¥0,000'],
      ['通信費', 20, 18, '+¥000'], ['交通費', 25, 14, '+¥0,000'], ['娯楽費', 40, 52, '−¥0,000'], ['保険料', 22, 22, '¥0']
    ];
    const rows = src.map((x) => ({
      name: x[0], diff: x[3],
      planW: 'width: ' + x[1] + '%',
      actW: 'width: ' + x[2] + '%'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
