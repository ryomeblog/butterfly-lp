<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>グループから実績入力</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.s{width:390px;box-sizing:border-box;background:#FFFFFF;color:#111827;font-family:'Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.5;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bar{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #D1D5DB}
.bar h1{margin:0 0 0 4px;font-size:17px;font-weight:700;flex:1}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#111827;padding:0;text-decoration:none;font:inherit}
.body{flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;color:#4B5563}
.f{display:flex;flex-direction:column;gap:4px}
.in{height:44px;border:1px solid #9CA3AF;border-radius:6px;padding:0 10px;font:inherit;box-sizing:border-box;width:100%;background:#fff;color:#111827}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.li{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;min-height:56px;border-bottom:1px solid #E5E7EB}
.li input[type=checkbox]{width:20px;height:20px}
.amt{height:40px;border:1px solid #9CA3AF;border-radius:6px;padding:0 8px;font:inherit;text-align:right;box-sizing:border-box;width:100%;font-variant-numeric:tabular-nums}
.off{color:#6B7280}
.amt.filled{border:2px solid #1D4ED8;font-weight:700}
.tag{font-size:11px;border:1px solid #9CA3AF;border-radius:4px;padding:0 6px;color:#374151}
.card{border:1px solid #D1D5DB;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#F9FAFB}
.kv{display:flex;justify-content:space-between}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:20px;height:20px}
.btn{height:48px;border-radius:8px;border:1px solid #111827;background:#fff;color:#111827;font:inherit;font-weight:500;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.pri{background:#1D4ED8;border-color:#1D4ED8;color:#FFFFFF}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.tg{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:0;background:none;font:inherit;font-size:13px;padding:0;color:#111827;cursor:pointer}
.tg .tr{width:44px;height:26px;border-radius:13px;background:#9CA3AF;position:relative;flex:none}
.tg .tr::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg[aria-checked=true] .tr{background:#1D4ED8}
.tg[aria-checked=true] .tr::after{left:21px}
.tx{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;min-height:48px;border-bottom:1px solid #E5E7EB;color:#111827;text-decoration:none;font-size:13px}
.tx:last-child{border-bottom:0}
.pr{display:grid;grid-template-columns:34px 1fr auto 36px;gap:8px;align-items:center;min-height:48px;border-bottom:1px solid #E5E7EB;font-size:13px}
</style>
</helmet>
<div class="s" style="height: 1070px">
<header class="bar">
<a class="ib" href="TxnEdit.dc.html" aria-label="戻る"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1>グループから実績入力</h1>
</header>
<main class="body">
<div class="g2">
<label class="f"><span class="lbl">グループ</span><select class="in"><option>A社の給与明細</option><option>住居費</option><option>銘柄A</option></select></label>
<label class="f"><span class="lbl">日付（全項目共通）</span><input class="in" type="date" value="2026-11-25"/></label>
</div>
<div style="border: 1px solid #B45309; background: #FFFBEB; color: #78350F; border-radius: 6px; padding: 8px 10px; font-size: 12px">このグループには削除されたテンプレートの項目が1件あり、入力欄に出していません。<a href="GroupEdit.dc.html">グループを修正する</a></div>
<div class="lbl">金額には予定の金額（予定がない月はグループの金額）が入っています。予定どおりならそのまま保存し、明細と違う項目だけ直します。金額を空にした項目は実績にしません。</div>
<section style="display: flex; flex-direction: column">
<label class="li"><span><span class="tag">収入</span> 給与（額面）<br><span class="lbl">予定 ¥000,000（11月の予定）</span></span><input class="amt filled" inputmode="numeric" aria-label="給与（額面）の実績額" placeholder="記録しない" value="000,000"/></label>
<label class="li"><span><span class="tag">支出</span> 所得税<br><span class="lbl">予定 ¥0,000（給与の 0.0%）</span></span><input class="amt filled" inputmode="numeric" aria-label="所得税の実績額" placeholder="記録しない" value="0,000"/></label>
<label class="li"><span><span class="tag">支出</span> 住民税<br><span class="lbl">予定 ¥00,000（11月の予定）</span></span><input class="amt filled" inputmode="numeric" aria-label="住民税の実績額" placeholder="記録しない" value="00,000"/></label>
<label class="li"><span><span class="tag">支出</span> 社会保険料<br><span class="lbl">予定 ¥00,000（給与の 00.0%）</span></span><input class="amt filled" inputmode="numeric" aria-label="社会保険料の実績額" placeholder="記録しない" value="00,000"/></label>
<label class="li off"><span><span class="tag">収入</span> ボーナス<br><span class="lbl">11月は予定なし（6月・12月）</span></span><input class="amt" inputmode="numeric" aria-label="ボーナスの実績額" placeholder="記録しない"/></label>
<label class="li off"><span><span class="tag">支出</span> ボーナスの税・社会保険料<br><span class="lbl">11月は予定なし（ボーナスの 00.0%）</span></span><input class="amt" inputmode="numeric" aria-label="ボーナスの税・社会保険料の実績額" placeholder="記録しない"/></label>
<label class="li"><span><span class="tag">振替</span> 持株会<br><span class="lbl">予定 ¥00,000・メイン銀行 → 証券口座</span></span><input class="amt filled" inputmode="numeric" aria-label="持株会の実績額" placeholder="記録しない" value="00,000"/></label>
</section>
<section class="card">
<div class="kv"><span class="lbl">収入</span><span class="num">+¥000,000</span></div>
<div class="kv"><span class="lbl">支出</span><span class="num">−¥00,000</span></div>
<div class="kv"><span class="lbl">振替</span><span class="num">¥00,000</span></div>
<div class="kv" style="border-top: 1px solid #E5E7EB; padding-top: 6px"><strong>差引（メイン銀行の増減）</strong><strong class="num">+¥000,000</strong></div>
<div class="lbl">明細の「差引支給額」と合っているか確認できます。</div>
</section>
<button class="tg" role="switch" aria-checked="false" style="align-self: flex-start; text-align: left"><span class="tr" aria-hidden="true"></span>入力した実績でグループの金額・割合を更新する</button>
<div class="g2" style="margin-top: auto">
<a class="btn" href="Ledger.dc.html">キャンセル</a>
<a class="btn pri" href="Ledger.dc.html">5件の実績を保存</a>
</div>
</main>
</div>
</x-dc>

</body>
</html>
